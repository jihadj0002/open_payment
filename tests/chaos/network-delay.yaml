apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: payment-api-network-delay
  namespace: openpayment
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - openpayment
    labelSelectors:
      app: openpayment-api
  delay:
    latency: '200ms'
    correlation: '50'
    jitter: '50ms'
  duration: '120s'
  scheduler:
    cron: '@every 10m'
