groups:
  - name: openpayment-sla-alerts
    interval: 1m
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_errors_total[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Error rate exceeds 1%"
          description: "API error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
          > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency exceeds 2s"
          description: "P99 latency is {{ $value }}s over the last 5 minutes"

      - alert: LowAvailability
        expr: |
          (
            1 - (
              sum(rate(http_errors_total[5m]))
              /
              sum(rate(http_requests_total[5m]))
            )
          ) < 0.999
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "API availability below 99.9%"
          description: "Availability is {{ $value | humanizePercentage }} over the last 10 minutes"

      - alert: HighPaymentFailureRate
        expr: |
          rate(payment_status_total{status="failed"}[5m])
          /
          rate(payment_status_total{status=~"succeeded|captured"}[5m])
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Payment failure rate exceeds 5%"
          description: "Payment failure rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: DatabaseConnectionHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connections"
          description: "Database connection count is {{ $value }}"
